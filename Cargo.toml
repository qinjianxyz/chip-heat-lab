[workspace]
members = [
  "crates/chip_heat_core",
  "crates/chip_heat_cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/qinjianxyz/chip-heat-lab"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
